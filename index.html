<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Osobnostní dotazníky</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --text:#1f2328; --muted:#5f6670; --line:#e3e1da;
  --accent:#2f5d8a; --accent-soft:#e6eef6; --accent-text:#ffffff;
  --track:#ebe9e3; --radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181b; --card:#1f2226; --text:#e8e6e1; --muted:#a3a8b0; --line:#30343a;
    --accent:#7fb0e0; --accent-soft:#25313d; --accent-text:#10151b;
    --track:#2c3036; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{max-width:720px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{font:inherit;font-size:.8rem;font-weight:600;letter-spacing:.04em;border:none;background:none;color:var(--muted);padding:.35em .9em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
main{max-width:720px;margin:0 auto;padding:8px 16px 48px}
h1{font-size:1.75rem;line-height:1.2;margin:.2em 0 .4em}
h2{font-size:1.25rem;margin:0 0 .3em}
p{margin:.5em 0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:.65em 1.1em;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:none;background:none;padding:.4em 0;color:var(--accent);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.field{display:block;margin:16px 0}
label.field > span{display:block;font-weight:600;margin-bottom:6px}
label.field > span span{font-weight:400}
input[type=text]{width:100%;font:inherit;padding:.6em .8em;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
ul.clean{padding-left:1.2em;margin:.5em 0}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.92rem}

/* Otázky */
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}
.progress{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin:10px 0 0}
.progress > div{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qtext{font-size:1.35rem;line-height:1.4;font-weight:600;margin:28px 0 22px;min-height:3.8em}
.options{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--track)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .num{background:var(--accent);color:var(--accent-text)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.kbd-hint{text-align:center;margin-top:18px}
@media (hover:none){.kbd-hint{display:none}}

/* Výsledky */
.factor-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.factor-head .score{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.level{font-size:.85rem;color:var(--muted)}
.bar{position:relative;height:14px;background:var(--track);border-radius:99px;margin:12px 0 4px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.bar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.5}
.ticks{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.poles{margin:14px 0 4px;display:grid;gap:6px;font-size:.92rem}
.pole{color:var(--muted)}
.pole b{color:var(--text);font-weight:600}
.pole.on{color:var(--text)}
.pole.on::before{content:"● ";color:var(--accent)}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:.92rem;color:var(--accent)}
.facet{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 3em;gap:10px;align-items:center;margin:10px 0;font-size:.9rem}
.facet .sub{color:var(--muted);font-size:.78rem;display:block}
.facet .bar{height:8px;margin:0}
.facet .val{text-align:right;font-variant-numeric:tabular-nums}
.results-actions{padding:12px 0 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{margin-top:40px;font-size:.8rem;color:var(--muted);text-align:center}

/* Moje komunikační cíle */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:.4em .9em;cursor:pointer;background:var(--card)}
.chip input{accent-color:var(--accent);margin:0}
.chip:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
fieldset.field{border:none;padding:0;margin:16px 0}
fieldset.field legend{font-weight:600;margin-bottom:8px;padding:0}
.gsec{color:var(--accent);font-weight:600;margin:22px 0 0}
.qtext.gq{margin:8px 0 6px;min-height:0}
.ghints{margin:0 0 6px;padding-left:1.2em;color:var(--muted);font-size:.95rem}
.grow{margin:18px 0 0}
.grow-head{margin-bottom:8px}
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sopt{font:inherit;font-weight:700;font-size:1.05rem;padding:12px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.sopt:hover{border-color:var(--accent)}
.sopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-text)}
.sopt.goal[aria-pressed="true"]{background:var(--accent-soft);color:var(--text);box-shadow:inset 0 0 0 2px var(--accent)}
.scale-ends{display:flex;justify-content:space-between;margin-top:4px}
.gwho{margin-top:16px}
.psec{font-size:1rem;margin:22px 0 8px}
.picks{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.pick:hover:not(:disabled){border-color:var(--accent)}
.pick:disabled{opacity:.45;cursor:not-allowed}
.pick .pbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick[aria-pressed="true"] .pbox{background:var(--accent);border-color:var(--accent)}
.pick[aria-pressed="true"] .pbox::after{content:"✓";color:var(--accent-text);font-size:.8rem;font-weight:700}
.pcount{font-weight:600}
.pcount.full{color:var(--accent)}
.gcard h2{margin-bottom:.1em}
.glist{list-style:none;padding:0;margin:12px 0 0}
.gr{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.gr:first-child{border-top:none}
.gl b{font-weight:600}
.gfull{display:block}
.glist.compact .gfull{display:none}
.glist.compact .gr{padding:6px 0}
.gm{display:flex;align-items:center;gap:6px;white-space:nowrap}
.tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-left:4px}
.dots{display:inline-flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--accent)}
.dots.goal i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.dots.goal i.on{box-shadow:inset 0 0 0 2.5px var(--accent)}
.gnote{grid-column:1 / -1;color:var(--accent);font-weight:600}
.star{color:var(--accent);margin-right:4px}
.gcard.gs{border-left:4px solid var(--accent)}
.gcard.gi{border-left:4px solid var(--muted)}
#gnote{width:100%;font:inherit;padding:.6em .8em;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical}
.print-only{display:none}
@media (max-width:520px){ .gr{grid-template-columns:1fr} }

@media print{
  body{background:#fff;color:#000;font-size:11pt}
  main{max-width:none;padding:0}
  .card{box-shadow:none;break-inside:avoid;border-color:#bbb}
  .no-print,.results-actions,.toast,.topbar{display:none!important}
  .bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  summary{color:#000}
  .gcard{padding:10px 16px;margin:8px 0;break-inside:auto}
  .gcard h2,.gcard .muted{break-after:avoid}
  .gr{padding:6px 0}
  .gcard.gstep{break-inside:avoid}
  .goverview details{border-top:none;padding-top:0;margin-top:0}
  .gcard.gs,.gcard.gi{border-left-width:4px}
  .dots i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .goverview{break-before:page}
  .goverview summary{list-style:none;font-size:1.25rem;color:#000}
  .goverview summary::-webkit-details-marker{display:none}
  #gnote{display:none}
  .print-only{display:block}
  .gnote-print .line{display:block;border-bottom:1px solid #999;height:1.9em}
  .gr{break-inside:avoid}
  h1{font-size:1.5rem}
}
</style>
</head>
<body>
<header class="topbar no-print">
  <div class="lang" role="group" aria-label="Jazyk / Language">
    <button data-lang="cs" aria-pressed="false">CZ</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   DOTAZNÍKY / QUESTIONNAIRES
   Každý dotazník je jeden objekt v TESTS. Texty jsou ve tvaru {cs:…, en:…}.
   - items: výroky v pořadí (pozice = číslo položky 1..n), pro každý jazyk
   - scale: možnosti odpovědí (hodnoty 1..k)
   - factors: dimenze -> facety -> položky ("30R" = obráceně skórovaná)
   ===================================================================== */

const LIKERT5 = [
  {v:1, label:{cs:'Rozhodně nesouhlasím', en:'Strongly disagree'}},
  {v:2, label:{cs:'Nesouhlasím',          en:'Disagree'}},
  {v:3, label:{cs:'Neutrální',            en:'Neutral'}},
  {v:4, label:{cs:'Souhlasím',            en:'Agree'}},
  {v:5, label:{cs:'Rozhodně souhlasím',   en:'Strongly agree'}}
];

const ACCURACY5 = [
  {v:1, label:{cs:'Vůbec mě nevystihuje',  en:'Very inaccurate'}},
  {v:2, label:{cs:'Spíše mě nevystihuje',  en:'Moderately inaccurate'}},
  {v:3, label:{cs:'Ani ano, ani ne',       en:'Neither accurate nor inaccurate'}},
  {v:4, label:{cs:'Spíše mě vystihuje',    en:'Moderately accurate'}},
  {v:5, label:{cs:'Zcela mě vystihuje',    en:'Very accurate'}}
];

const TESTS = {
  hexaco60: {
    id: 'hexaco60',
    title: 'HEXACO-60',
    subtitle: {cs:'Šest základních dimenzí osobnosti', en:'Six basic dimensions of personality'},
    about: {
      cs:'Krátká verze osobnostního inventáře HEXACO. Měří poctivost-pokoru, emocionalitu, extraverzi, přívětivost, svědomitost a otevřenost vůči zkušenosti.',
      en:'The short version of the HEXACO Personality Inventory. It measures honesty-humility, emotionality, extraversion, agreeableness, conscientiousness and openness to experience.'
    },
    duration: {cs:'cca 10 minut', en:'about 10 minutes'},
    credit: {
      cs:'HEXACO-60 © Kibeom Lee & Michael C. Ashton (hexaco.org). Použito pro nekomerční vzdělávací účely.',
      en:'HEXACO-60 © Kibeom Lee & Michael C. Ashton (hexaco.org). Used for non-commercial educational purposes.'
    },
    scale: LIKERT5,
    instructions: {
      cs:[
        'Najdete zde 60 výroků. U každého zvolte, nakolik s ním souhlasíte.',
        'Odpovídejte podle toho, jací opravdu jste – ne jací byste chtěli být nebo jak by vás chtěli vidět ostatní.',
        'Nejsou tu správné ani špatné odpovědi. Nepřemýšlejte nad jedním výrokem příliš dlouho, první odpověď bývá nejpřesnější.',
        'Odpovězte prosím na všechny výroky, i když si u některých nejste úplně jistí.'
      ],
      en:[
        'You will find 60 statements about yourself. For each one, choose how much you agree with it.',
        'Answer according to how you really are – not how you would like to be or how others would like to see you.',
        'There are no right or wrong answers. Don’t think too long about any one statement; your first answer is usually the most accurate.',
        'Please respond to every statement, even if you are not completely sure.'
      ]
    },
    items: {
      cs: [
        'Návštěva umělecké galerie by mě zřejmě nudila.',
        'Plánuji dopředu a organizuji věci, abych se vyhnul/a honičce na poslední chvíli.',
        'Jen vzácně chovám zášť vůči lidem, kteří mi hodně ukřivdili.',
        'Celkově jsem se sebou přiměřeně spokojený/á.',
        'Bál/a bych se, kdybych musel/a cestovat ve špatném počasí.',
        'Neužil/a bych lichocení k tomu, abych dosáhl/a zvýšení platu nebo povýšení v práci, i kdybych si myslel/a, že tím uspěji.',
        'Zajímám se o poznávání historie a politiky ostatních zemí.',
        'Často vynakládám velké úsilí, když se snažím dosáhnout nějakého cíle.',
        'Lidé mi občas říkají, že jsem k ostatním příliš kritický/á.',
        'Zřídka vyjadřuji své názory na skupinových schůzkách.',
        'Někdy se neubráním obavám z maličkostí.',
        'Kdybych věděl/a, že mě nikdy nechytí, byl/a bych ochoten/a ukrást 10 milionů korun.',
        'Těšilo by mě vytváření uměleckého díla, jako například románu, písně nebo malby.',
        'Když na něčem pracuji, nevěnuji moc pozornosti malým detailům.',
        'Lidé mi občas říkají, že jsem příliš tvrdohlavý/á.',
        'Raději pracuji s lidmi než o samotě.',
        'Když jsem prožil/a bolestný zážitek, potřebuji někoho, abych se cítil/a lépe.',
        'Není pro mě obzvláště důležité mít hodně peněz.',
        'Věnovat pozornost extrémním (radikálním) názorům je ztráta času.',
        'Dělám rozhodnutí spíše na základě aktuálních pocitů než po pečlivé úvaze.',
        'Lidé si o mně myslí, že mám prudkou povahu.',
        'Po většinu dní se cítím veselý/á a optimistický/á.',
        'Je mi do pláče, když vidím ostatní lidi plakat.',
        'Myslím si, že mám nárok na víc respektu než průměrný člověk.',
        'Kdybych měl/a příležitost, rád/a bych navštívil/a koncert klasické hudby.',
        'Když pracuji, mám někdy problémy kvůli svému neorganizovanému přístupu.',
        'Můj postoj k lidem, kteří se mnou špatně jednali, je „odpusť a zapomeň“.',

        'Když přijde na fyzické nebezpečí, jsem velmi vystrašený/á.',
        'Pokud od někoho něco chci, budu se smát jeho nejhorším vtipům.',
        'Nikdy mě opravdu nebavilo prohlížení encyklopedie.',
        'Dělám pouze minimální množství potřebné práce, abych obstál/a.',
        'Při posuzování druhých lidí bývám velmi shovívavý/á.',
        'Ve společenských situacích jsem obvykle tím, kdo dělá první krok.',
        'Strachuji se mnohem méně než většina lidí.',
        'Nikdy bych nepřijal/a úplatek, ani kdyby byl velmi vysoký.',
        'Lidé mi často říkají, že mám dobrou představivost.',
        'Vždycky se snažím být při práci přesný/á, i na úkor času.',
        'Pokud se mnou lidé nesouhlasí, celkem pružně své názory měním.',
        'První věc, kterou vždy dělám na novém místě, je nalezení nových přátel.',
        'Dovedu zvládnout obtížné situace bez potřeby emoční podpory od někoho jiného.',
        'Velmi by mě těšilo vlastnit drahé, luxusní zboží.',
        'Mám rád/a lidi, kteří mají neobvyklé názory.',
        'Dělám mnoho chyb, protože nepřemýšlím předtím, než jednám.',
        'Většina lidí má tendenci se rozčílit rychleji než já.',
        'Většina lidí je pozitivnější a dynamičtější, než jsem obvykle já.',
        'Cítím silné emoce, když někdo mně blízký odjíždí na dlouhou dobu.',
        'Chci, aby lidé věděli, že jsem důležitá osoba s vysokým postavením.',
        'Nemyslím si o sobě, že jsem umělecký nebo tvůrčí typ.',
        'Lidé mě často nazývají perfekcionistou.',
        'I když lidé dělají hodně chyb, jen zřídka řeknu něco negativního.',
        'Občas mám pocit, že jsem bezcenný člověk.',
        'Nepropadal/a bych panice ani ve stavu nouze.',
        'Nepředstíral/a bych, že mám někoho rád jen proto, aby mně dotyčný prokázal laskavost.',
        'Diskuze o filozofii pokládám za nudné.',
        'Raději dělám cokoli, co mě právě napadne, než abych se držel/a plánu.',
        'Když mi lidé říkají, že se mýlím, mou první reakcí je dohadovat se s nimi.',
        'Ve skupině lidí jsem často tím, kdo mluví za celou skupinu.',
        'Zůstávám bez emocí i v situacích, ve kterých se většina lidí stává velmi sentimentálními.',
        'Byl/a bych v pokušení použít padělané peníze, kdybych si byl/a jistý/á, že mi to projde.'
      ],
      en: [
        "I would be quite bored by a visit to an art gallery.",
        "I plan ahead and organize things, to avoid scrambling at the last minute.",
        "I rarely hold a grudge, even against people who have badly wronged me.",
        "I feel reasonably satisfied with myself overall.",
        "I would feel afraid if I had to travel in bad weather conditions.",
        "I wouldn't use flattery to get a raise or promotion at work, even if I thought it would succeed.",
        "I'm interested in learning about the history and politics of other countries.",
        "I often push myself very hard when trying to achieve a goal.",
        "People sometimes tell me that I am too critical of others.",
        "I rarely express my opinions in group meetings.",
        "I sometimes can't help worrying about little things.",
        "If I knew that I could never get caught, I would be willing to steal a million dollars.",
        "I would enjoy creating a work of art, such as a novel, a song, or a painting.",
        "When working on something, I don't pay much attention to small details.",
        "People sometimes tell me that I'm too stubborn.",
        "I prefer jobs that involve active social interaction to those that involve working alone.",
        "When I suffer from a painful experience, I need someone to make me feel comfortable.",

        "I think that paying attention to radical ideas is a waste of time.",
        "I make decisions based on the feeling of the moment rather than on careful thought.",
        "People think of me as someone who has a quick temper.",
        "On most days, I feel cheerful and optimistic.",
        "I feel like crying when I see other people crying.",
        "I think that I am entitled to more respect than the average person is.",
        "If I had the opportunity, I would like to attend a classical music concert.",
        "When working, I sometimes have difficulties due to being disorganized.",
        "My attitude toward people who have treated me badly is \"forgive and forget\".",
        "I feel that I am an unpopular person.",
        "When it comes to physical danger, I am very fearful.",
        "If I want something from someone, I will laugh at that person's worst jokes.",
        "I've never really enjoyed looking through an encyclopedia.",
        "I do only the minimum amount of work needed to get by.",

/* =====================================================================
   SKÓROVÁNÍ / SCORING
   ===================================================================== */
function parseKey(s){
  return s.trim().split(/\s+/).map(t => ({ n: parseInt(t, 10), r: /R$/i.test(t) }));
}
function itemScore(test, key, answers){
  const a = answers[key.n - 1];
  if (a == null) return null;
  return key.r ? (test.scale.length + 1 - a) : a;
}
function mean(xs){
  const v = xs.filter(x => x != null);
  return v.length ? v.reduce((a,b) => a + b, 0) / v.length : null;
}
function computeScores(test, answers){
  return test.factors.map(f => {
    const facets = f.facets.map(fc => {
      const keys = parseKey(fc.items);
      return { ...fc, keys, score: mean(keys.map(k => itemScore(test, k, answers))) };
    });
    // skóre dimenze = průměr přes všechny její položky (dle manuálu)
    const all = f.items ? parseKey(f.items) : facets.flatMap(fc => fc.keys);
    return { ...f, facets, score: mean(all.map(k => itemScore(test, k, answers))) };
  });
}
function levelOf(score, k = 5){
  const mid = (k + 1) / 2, band = (k - 1) / 8;   // u škály 1–5: 2,5 / 3,5
  if (score < mid - band) return 'low';
  if (score > mid + band) return 'high';
  return 'mid';
}

function renderResults(testId, answers, opts = {}, keepScroll){
  view = 'results';

  const midNum = (k + 1) / 2;

  const name = opts.name || '';

  const factorCards = scores.map(f => {
    const lv = levelOf(f.score, k);
    const facets = f.facets.map(fc => `
      <div class="facet">
        <div>${esc(nm(fc))}${sub(fc) ? `<span class="sub">${esc(sub(fc))}</span>` : ''}</div>
        <div class="bar"><div class="fill" style="width:${pct(fc.score, k)}%"></div><div class="mid"></div></div>
        <div class="val">${fmt(fc.score)}</div>
      </div>`).join('');
    return `<div class="card">
      <div class="factor-head">
        <div><h2>${esc(nm(f))}</h2><div class="level">${sub(f) ? esc(sub(f)) + ' · ' : ''}${u.levels[lv]}${f.interstitial ? ' · ' + u.interstitial : ''}</div></div>
        <div class="score">${fmt(f.score)}</div>
      </div>
      <div class="bar"><div class="fill" style="width:${pct(f.score, k)}%"></div><div class="mid"></div></div>
      <div class="ticks"><span>1</span><span>${midLabel}</span><span>${k}</span></div>
      <div class="poles">
        <div class="pole ${lv === 'high' ? 'on' : ''}"><b>${u.higher}</b> ${esc(L(f.high))}</div>
        <div class="pole ${lv === 'low' ? 'on' : ''}"><b>${u.lower}</b> ${esc(L(f.low))}</div>
      </div>
      ${f.facets.length ? `<details>
        <summary>${u.facets}</summary>
        ${facets}
      </details>` : ''}
    </div>`;
  }).join('');

  const header = opts.shared
    ? `<p class="muted">${u.shared}</p>`
    : `<p class="muted">${name ? esc(name) + ' · ' : ''}${new Date().toLocaleDateString(u.locale)}</p>`;

  render(`
    <button class="btn link no-print" data-home>${u.home}</button>
    <h1>${u.resultsTitle(esc(L(t.title)))}</h1>
    ${header}
    <div class="card note" style="box-shadow:none">${u.resultsNote(k, midLabel)}${t.resultsExtra ? '<br><br>' + esc(L(t.resultsExtra)) : ''}</div>
    ${factorCards}
    <div class="results-actions no-print">
      <div class="row">
        <button class="btn primary" data-print>${u.print}</button>
        <button class="btn" data-copylink>${u.copyLink}</button>
        <button class="btn" data-csv>${u.csv}</button>
        ${opts.shared ? `<button class="btn" data-home>${u.takeIt}</button>` : `<button class="btn" data-restart="${t.id}">${u.retake}</button>`}
      </div>
    </div>
    <footer>${esc(L(t.credit))}<br>${u.notSent}</footer>
  `, keepScroll);

  app.querySelector('[data-print]').onclick = () => window.print();
  app.querySelector('[data-copylink]').onclick = () => copyText(resultsUrl(t, answers));
  app.querySelector('[data-csv]').onclick = () => downloadCSV(t, answers, scores, name);
}

   ===================================================================== */
function copyText(text, msg){
  const u = T();
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast(msg || u.copied), () => window.prompt(u.copyPrompt, text));
  } else {
    window.prompt(u.copyPrompt, text);
  }
}
function downloadCSV(t, answers, scores, name){
  const u = T();
  const head = [...u.csvHead];
  const row = [name, new Date().toISOString().slice(0, 10), t.id, lang];
  scores.forEach(f => {
    head.push(f.id + ' ' + nm(f)); row.push(fmt(f.score));
    f.facets.forEach(fc => { head.push(f.id + ': ' + nm(fc)); row.push(fmt(fc.score)); });
  });
  answers.forEach((a, i) => { head.push(u.itemPrefix + (i + 1)); row.push(a); });
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = '﻿' + head.map(q).join(u.csvSep) + '\r\n' + row.map(q).join(u.csvSep) + '\r\n';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  const safe = (name || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '');
  a.href = URL.createObjectURL(blob);
  a.download = `${t.id}-${safe || (lang === 'en' ? 'results' : 'vysledky')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const G = () => GU[lang];
const isGoals = t => !!t && t.kind === 'goals';
const gN = () => GOALS_ITEMS.length;
const gItemDone = (st, i) => st.answers[i] != null && st.answers[gN() + i] != null;
function gDoneCount(st){ let c = 0; for (let i = 0; i < gN(); i++) if (gItemDone(st, i)) c++; return c; }
function gFirstMissing(st){ for (let i = 0; i < gN(); i++) if (!gItemDone(st, i)) return i; return -1; }
const gPersonLabel = p => (p != null && GOALS_PERSONS[p]) ? L(GOALS_PERSONS[p]) : '';

/* Postup v dotazníku pro úvodní stránku (funguje pro oba typy dotazníků) */
function progressOf(t, saved){
  const n = itemCount(t);
  if (!saved || !saved.answers) return { done: 0, n, complete: false };
  if (isGoals(t)) return { done: gDoneCount(saved), n, complete: !!saved.finished };
  const done = saved.answers.filter(a => a != null).length;
  return { done, n, complete: done === n };
}
/* Pokračování v rozpracovaném dotazníku */
function resumeSaved(saved){
  state = saved;
  if (isGoals(TESTS[state.testId])) {
    const miss = gFirstMissing(state);
    if (miss === -1) return renderPicks();
    state.index = miss;
    return renderQuestion();
  }
  const miss = state.answers.findIndex(a => a == null);
  state.index = miss === -1 ? state.answers.length - 1 : miss;
  return renderQuestion();
}
function openSavedResults(id, saved){
  if (isGoals(TESTS[id])) return renderGoalsResults(id, saved.answers, saved.picks || [], { own: true, name: saved.name, person: saved.person, personName: saved.personName });
  return renderResults(id, saved.answers, { name: saved.name });
}

/* Otázka: jeden výrok, dvě řady hodnocení */

function renderGoalsQuestion(keepScroll){
  view = 'question'; currentTestId = state.testId;
  rerender = () => renderGoalsQuestion(true);
  setTestHash(state.testId);
  const u = T(), g = G(), n = gN(), i = state.index, it = GOALS_ITEMS[i];
  const done = gDoneCount(state);

  let nextBtn;

    ${gScaleRow('now', state.answers[i])}

    <p class="small muted gwho">${esc(g.thinking(who))}</p>

}
function goalsAnswer(row, v){
  const n = gN(), i = state.index;
  state.answers[row === 'now' ? i : n + i] = v;
  save();
  clearTimeout(advanceTimer);
  renderGoalsQuestion(true);
  if (gItemDone(state, i) && i < n - 1) {
    advanceTimer = setTimeout(() => {
      if (view === 'question' && state && state.index === i) { state.index++; save(); renderGoalsQuestion(); }
    }, 350);
  }
}
function goalsKey(e){
  const n = parseInt(e.key, 10), i = state.index, N = gN();
  if (n >= 1 && n <= 5) {
    e.preventDefault();
    return goalsAnswer(state.answers[i] == null ? 'now' : 'goal', n);
  }
  if (e.key === 'ArrowLeft' && i > 0) { clearTimeout(advanceTimer); state.index--; save(); renderGoalsQuestion(); }
  if (e.key === 'ArrowRight' && i < N - 1 && gItemDone(state, i)) { clearTimeout(advanceTimer); state.index++; save(); renderGoalsQuestion(); }
}

/* Výběr nejdůležitějších cílů */
function renderPicks(keepScroll){
  view = 'picks'; currentTestId = state.testId;

      const on = picks.includes(i);

  }).join('');
  render(`

    <div class="qnav">
      <button class="btn" data-gback>${g.backToItems}</button>
      <button class="btn primary" data-gfinish>${g.showOverview}</button>

function togglePick(i){
  const p = state.picks;
  const k = p.indexOf(i);
  if (k >= 0) p.splice(k, 1);
  else if (p.length < GOALS_MAX_PICKS) p.push(i);
  p.sort((a, b) => a - b);
  save();
  renderPicks(true);
}

/* Výpočty pro přehled */
function goalsAnalysis(answers, picks){
  const n = gN();
  const items = GOALS_ITEMS.map((it, i) => {
    const now = answers[i], goal = answers[n + i];
    return { i, it, now, goal, gap: goal - now, picked: picks.includes(i) };
  });
  // silné stránky: nejvyšší „reálně“ (alespoň 4); při shodě vybrané cíle, pak vyšší cíl
  const strengths = items.filter(x => x.now >= 4)
    .sort((a, b) => b.now - a.now || b.picked - a.picked || b.goal - a.goal || a.i - b.i).slice(0, 5);
  // prostor pro zlepšení: největší rozdíl cíl − reálně; vybrané cíle dostanou přednost (+1,5)
  const prio = x => x.gap + (x.picked ? 1.5 : 0);
  const improve = items.filter(x => x.gap >= 1)
    .sort((a, b) => prio(b) - prio(a) || b.goal - a.goal || a.i - b.i).slice(0, 5);
  const important = items.filter(x => x.picked);
  // kde chci ubrat: reálně je výš než cíl
  const less = items.filter(x => x.gap <= -1).sort((a, b) => a.gap - b.gap || a.i - b.i).slice(0, 5);
  return { items, strengths, improve, important, less };
}
const gDots = (v, cls) => `<span class="dots ${cls || ''}" role="img" aria-label="${G().of5(v)}">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= v ? 'on' : ''}"></i>`).join('')}</span>`;
function gRow(x, note){
  const g = G();
  return `<li class="gr">
    <div class="gl">${x.picked ? '<span class="star" aria-hidden="true">★</span>' : ''}<b>${esc(L(x.it.label))}</b>
      <span class="gfull small muted">${esc(L(x.it.t))}</span></div>
    <div class="gm"><span class="tag">${g.nowShort}</span>${gDots(x.now)}<span class="tag">${g.goalShort}</span>${gDots(x.goal, 'goal')}</div>
    ${note ? `<div class="gnote small">${note}</div>` : ''}
  </li>`;
}
function gCard(title, lead, rows, empty, cls){
  return `<div class="card gcard ${cls || ''}"><h2>${title}</h2><p class="muted small">${lead}</p>
    ${rows.length ? `<ul class="glist">${rows.join('')}</ul>` : `<p class="small">${empty}</p>`}</div>`;
}

function goalsUrl(answers, picks, person){
  return location.origin + location.pathname + location.search + '#v=cile-' + answers.join('') + '-' + picks.map(i => i.toString(36)).join('') + '-' + person;
}
function renderGoalsResults(testId, answers, picks, opts = {}, keepScroll){
  view = 'results'; currentTestId = null;
  rerender = () => renderGoalsResults(testId, answers, picks, opts, true);
  const t = TESTS[testId], u = T(), g = G();
  const a = goalsAnalysis(answers, picks);
  history.replaceState(null, '', location.pathname + location.search + '#v=cile-' + answers.join('') + '-' + picks.map(i => i.toString(36)).join('') + '-' + opts.person);

  const strengths = a.strengths.map(x => gRow(x, x.picked ? esc(g.alsoImportant) : ''));
  const improve = a.improve.map(x => gRow(x, esc(g.move(x.gap))));
  const important = a.important.map(x => gRow(x, esc(x.gap > 0 ? g.move(x.gap) : x.gap === 0 ? g.there : g.above)));
  const less = a.less.map(x => gRow(x, esc(g.reduce(-x.gap))));

  const overview = GOALS_SECTIONS.map((s, si) => `<h3 class="psec">${si + 1}. ${esc(L(s.title))}</h3>
    <ul class="glist compact">${a.items.filter(x => x.it.section === si).map(x => gRow(x, '')).join('')}</ul>`).join('');

  const who = gPersonLabel(opts.person) + (opts.personName ? ` · ${opts.personName}` : '');
  const header = opts.shared
    ? `<p class="muted">${u.shared} · ${g.relation}: ${esc(who)}</p>`
    : `<p class="muted">${opts.name ? esc(opts.name) + ' · ' : ''}${new Date().toLocaleDateString(u.locale)} · ${g.relation}: ${esc(who)}</p>`;

  const own = opts.own ? store.get(storeKey(testId)) : null;
  const note = own && own.note ? own.note : '';
  const stepCard = opts.shared ? '' : `<div class="card gcard gstep"><h2>${g.step}</h2><p class="muted small">${g.stepLead}</p>
      <textarea id="gnote" rows="3" placeholder="${esc(g.stepPh)}">${esc(note)}</textarea>
      <div class="print-only gnote-print">${note ? esc(note).replace(/\n/g, '<br>') : '<span class="line"></span><span class="line"></span><span class="line"></span>'}</div>
    </div>`;

  render(`
    <button class="btn link no-print" data-home>${u.home}</button>
    <h1>${g.resultsTitle}</h1>
    ${header}
    <div class="card note no-print" style="box-shadow:none">${g.howTo}</div>
    ${gCard(g.strengths, g.strengthsLead, strengths, g.noStrengths, 'gs')}
    ${gCard(g.improve, g.improveLead, improve, g.noImprove, 'gi')}
    ${gCard(g.important, g.importantLead, important, g.noImportant, 'gp')}
    ${less.length ? gCard(g.less, g.lessLead, less, '', 'gl2') : ''}
    ${stepCard}
    <div class="card gcard goverview">
      <details><summary>${g.overview}</summary>${overview}</details>
    </div>
    <div class="results-actions no-print">
      <div class="row">
        <button class="btn primary" data-gpdf>${g.pdf}</button>
        <button class="btn" data-copylink>${u.copyLink}</button>
        <button class="btn" data-csv>${u.csv}</button>
        ${opts.shared ? `<button class="btn" data-home>${u.takeIt}</button>` : `<button class="btn" data-restart="${t.id}">${u.retake}</button>`}
      </div>
      <p class="small muted">${g.pdfHint}</p>
    </div>
    <footer>${esc(L(t.credit))}<br>${u.notSent}</footer>
  `, keepScroll);

  const ta = document.getElementById('gnote');
  if (ta) ta.addEventListener('input', () => {
    const s = store.get(storeKey(testId));
    if (s && opts.own) { s.note = ta.value; store.set(storeKey(testId), s); }
    const pr = app.querySelector('.gnote-print');
    pr.innerHTML = ta.value.trim() ? esc(ta.value).replace(/\n/g, '<br>') : '<span class="line"></span><span class="line"></span><span class="line"></span>';
  });
  app.querySelector('[data-gpdf]').onclick = () => {
    const old = document.title;
    const safe = (opts.name || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '');
    document.title = g.pdfName + (safe ? '-' + safe : '');
    window.addEventListener('afterprint', () => { document.title = old; }, { once: true });
    window.print();
  };
  app.querySelector('[data-copylink]').onclick = () => copyText(goalsUrl(answers, picks, opts.person));
  app.querySelector('[data-csv]').onclick = () => downloadGoalsCSV(answers, picks, opts);
}

function downloadGoalsCSV(answers, picks, opts){
  const u = T(), g = G(), n = gN();
  const head = [...u.csvHead, g.csvPerson];
  const row = [opts.name || '', new Date().toISOString().slice(0, 10), 'cile', lang, gPersonLabel(opts.person)];
  GOALS_ITEMS.forEach((it, i) => {
    head.push(`${g.nowShort}: ${L(it.label)}`); row.push(answers[i]);
    head.push(`${g.goalShort}: ${L(it.label)}`); row.push(answers[n + i]);
  });
  head.push(g.csvPicked); row.push(picks.map(i => L(GOALS_ITEMS[i].label)).join(' | '));
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = '﻿' + head.map(q).join(u.csvSep) + '\r\n' + row.map(q).join(u.csvSep) + '\r\n';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const el = document.createElement('a');
  const safe = (opts.name || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '');
  el.href = URL.createObjectURL(blob);
  el.download = `${g.pdfName}-${safe || (lang === 'en' ? 'results' : 'vysledky')}.csv`;
  document.body.appendChild(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(el.href), 1000);
}

function startFresh(testId, name){
  state = { testId, answers: Array(itemCount(TESTS[testId])).fill(null), index: 0, name: name || '' };
  draftName = '';
  save();
  renderQuestion();
}

app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if ('home' in d) { draftName = ''; return renderHome(); }
  if (d.start) return renderIntro(d.start);
  if (d.copytest) return copyText(testUrl(d.copytest), T().copiedTest);
  if (d.begin) {
    if (isGoals(TESTS[d.begin])) return startGoals(d.begin);
    return startFresh(d.begin, (document.getElementById('name') || {}).value || '');
  }
  if (d.resume) return resumeSaved(store.get(storeKey(d.resume)));
  if (d.g) return goalsAnswer(d.g, Number(d.v));
  if ('gpicks' in d) { clearTimeout(advanceTimer); return renderPicks(); }
  if (d.gpick != null) return togglePick(Number(d.gpick));
  if ('gback' in d) { state.index = gN() - 1; return renderQuestion(); }
  if ('gfinish' in d) {
    state.finished = true; save();
    return renderGoalsResults(state.testId, state.answers, state.picks, { own: true, name: state.name, person: state.person, personName: state.personName });
  }
  if (d.restart) {
    if (!confirm(T().confirmRestart)) return;
    store.del(storeKey(d.restart));
    return renderIntro(d.restart);
  }
  if (d.results) return openSavedResults(d.results, store.get(storeKey(d.results)));
  if (d.answer) return answer(Number(d.answer));
  if ('prev' in d) { clearTimeout(advanceTimer); state.index = Math.max(0, state.index - 1); save(); return renderQuestion(); }
  if ('next' in d) { clearTimeout(advanceTimer); state.index++; save(); return renderQuestion(); }
  if (d.goto != null) { state.index = Number(d.goto); save(); return renderQuestion(); }
  if ('finish' in d) return renderResults(state.testId, state.answers, { name: state.name });
});

document.addEventListener('keydown', e => {
  if (view !== 'question' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  const t = TESTS[state.testId];
  if (isGoals(t)) return goalsKey(e);
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= t.scale.length) { e.preventDefault(); return answer(n); }
  if (e.key === 'ArrowLeft' && state.index > 0) { clearTimeout(advanceTimer); state.index--; save(); renderQuestion(); }
  if (e.key === 'ArrowRight' && state.index < itemCount(t) - 1 && state.answers[state.index] != null) {
    clearTimeout(advanceTimer); state.index++; save(); renderQuestion();
  }
});

window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => d.open = true));

/* Otevření dotazníku přes jeho odkaz: dokončený → výsledky, rozpracovaný → pokračovat, jinak pokyny */
function openTest(id){
  const saved = store.get(storeKey(id));
  const { done, complete } = progressOf(TESTS[id], saved);
  if (complete) return openSavedResults(id, saved);
  if (done > 0 || (saved && saved.picks && saved.picks.length)) return resumeSaved(saved);
  return renderIntro(id);
}

/* Načtení: odkaz s výsledky (#v=hexaco60-1234...), odkaz na dotazník (#asertivita) nebo úvodní stránka */
function route(){
  const gm = location.hash.match(/^#v=([a-z0-9]+)-(\d+)-([0-9a-z]{0,5})-(\d)$/i);
  if (gm && isGoals(TESTS[gm[1]])) {
    const id = gm[1], n = gN();
    const answers = gm[2].split('').map(Number);
    const picks = [...gm[3]].map(c => parseInt(c, 36)).filter(i => i < n).sort((a, b) => a - b);
    const person = Number(gm[4]);
    if (answers.length === 2 * n && answers.every(a => a >= 1 && a <= 5) && person < GOALS_PERSONS.length) {
      const own = store.get(storeKey(id));
      const isOwn = own && own.finished && own.answers.join('') === gm[2] && (own.picks || []).join() === picks.join();
      return renderGoalsResults(id, answers, picks, isOwn
        ? { own: true, name: own.name, person: own.person, personName: own.personName }
        : { shared: true, person });
    }
  }
  const m = location.hash.match(/^#v=([a-z0-9]+)-(\d+)$/i);
  if (m && TESTS[m[1]]) {
    const t = TESTS[m[1]];
    const answers = m[2].split('').map(Number);
    if (answers.length === itemCount(t) && answers.every(a => a >= 1 && a <= t.scale.length)) {
      const own = store.get(storeKey(t.id));
      const isOwn = own && own.answers.join('') === m[2];
      return renderResults(t.id, answers, { shared: !isOwn, name: isOwn ? own.name : '' });
    }
  }
  const tm = location.hash.match(/^#\/?([^\/?#]+)$/);
  const id = tm && idFromSlug(tm[1]);
  if (id) {
    // už jsme na této obrazovce (adresu jsme nastavili sami) → nic nepřekreslovat
    if ((view === 'intro' || view === 'question' || view === 'picks') && currentTestId === id) return;
    return openTest(id);
  }
  renderHome();
}
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
applyLang();
route();
</script>
