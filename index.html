<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Osobnostní dotazníky</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --text:#1f2328; --muted:#5f6670; --line:#e3e1da;
  --accent:#2f5d8a; --accent-soft:#e6eef6; --accent-text:#ffffff;
  --track:#ebe9e3; --radius:14px;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181b; --card:#1f2226; --text:#e8e6e1; --muted:#a3a8b0; --line:#30343a;
    --accent:#7fb0e0; --accent-soft:#25313d; --accent-text:#10151b;
    --track:#2c3036; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.topbar{max-width:720px;margin:0 auto;padding:12px 16px 0;display:flex;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang button{font:inherit;font-size:.8rem;font-weight:600;letter-spacing:.04em;border:none;background:none;color:var(--muted);padding:.35em .9em;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
main{max-width:720px;margin:0 auto;padding:8px 16px 48px}
h1{font-size:1.75rem;line-height:1.2;margin:.2em 0 .4em}
h2{font-size:1.25rem;margin:0 0 .3em}
p{margin:.5em 0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:.65em 1.1em;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:none;background:none;padding:.4em 0;color:var(--accent);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.field{display:block;margin:16px 0}
label.field > span{display:block;font-weight:600;margin-bottom:6px}
label.field > span span{font-weight:400}
input[type=text]{width:100%;font:inherit;padding:.6em .8em;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
ul.clean{padding-left:1.2em;margin:.5em 0}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.92rem}

/* Otázky */
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}
.progress{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin:10px 0 0}
.progress > div{height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qtext{font-size:1.35rem;line-height:1.4;font-weight:600;margin:28px 0 22px;min-height:3.8em}
.options{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--track)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .num{background:var(--accent);color:var(--accent-text)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.kbd-hint{text-align:center;margin-top:18px}
@media (hover:none){.kbd-hint{display:none}}

/* Výsledky */
.factor-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.factor-head .score{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.level{font-size:.85rem;color:var(--muted)}
.bar{position:relative;height:14px;background:var(--track);border-radius:99px;margin:12px 0 4px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.bar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.5}
.ticks{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.poles{margin:14px 0 4px;display:grid;gap:6px;font-size:.92rem}
.pole{color:var(--muted)}
.pole b{color:var(--text);font-weight:600}
.pole.on{color:var(--text)}
.pole.on::before{content:"● ";color:var(--accent)}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:.92rem;color:var(--accent)}
.facet{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 3em;gap:10px;align-items:center;margin:10px 0;font-size:.9rem}
.facet .sub{color:var(--muted);font-size:.78rem;display:block}
.facet .bar{height:8px;margin:0}
.facet .val{text-align:right;font-variant-numeric:tabular-nums}
.results-actions{padding:12px 0 8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
footer{margin-top:40px;font-size:.8rem;color:var(--muted);text-align:center}

@media print{
  body{background:#fff;color:#000;font-size:11pt}
  main{max-width:none;padding:0}
  .card{box-shadow:none;break-inside:avoid;border-color:#bbb}
  .no-print,.results-actions,.toast,.topbar{display:none!important}
  .bar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  summary{color:#000}
}
</style>
</head>

  <div class="lang" role="group" aria-label="Jazyk / Language">
    <button data-lang="cs" aria-pressed="false">CZ</button>

  </div>

    print:'Vytisknout / uložit PDF', copyLink:'Zkopírovat odkaz', copied:'Odkaz na výsledky zkopírován', copyPrompt:'Zkopírujte odkaz:',
    csv:'Stáhnout CSV', takeIt:'Vyplnit dotazník',
    confirmRestart:'Opravdu začít znovu? Dosavadní odpovědi se smažou.',
    notSent:'Výsledky se nikam neodesílají.',
    locale:'cs-CZ', csvSep:';', decimalComma:true,
    csvHead:['jmeno','datum','dotaznik','jazyk'], itemPrefix:'v',
    onlyCs:'Výroky jsou zatím k dispozici jen česky.',
    interstitial:'mezilehlá faceta, nezapočítává se do dimenzí'
  },
  en: {
    appTitle:'Personality Questionnaires',
    homeLead:'Choose a questionnaire. Your answers are never sent anywhere – they stay in your browser only.',
    homeFooter:'The results are for self-reflection and learning, not psychological diagnosis.',
    start:'Start', showMine:'Show my results', retake:'Take it again',
    resume:(d,n)=>`Continue (${d}/${n})`, startOver:'Start over',
    meta:(n,d)=>`${n} statements · ${d}`,
    back:'← Back', instructions:'Instructions',
    nameLabel:'Name or nickname', optional:'(optional)', namePh:'Shown only in your results',
    saveNote:'Your answers are saved only in this browser, so you can stop and continue later.',
    begin:'Start the questionnaire',
    pause:'✕ Pause', counter:(i,n)=>`Statement ${i} of ${n}`, agreement:'Level of agreement',
    prev:'← Previous', next:'Next →', finish:'Show results', missing:n=>`Missing answers (${n}) →`,
    kbd:'You can also answer with keys 1–5 and move with the arrow keys.',
    home:'← Home', resultsTitle:t=>`Results: ${t}`, shared:'Shared results',
    resultsNote:'Each score is the average of your answers on a 1–5 scale (answers to reverse-worded statements are recoded). The vertical tick marks the middle of the scale (3) – <b>it is not the population average</b>. A short questionnaire is only approximate and each facet rests on just a few statements, so take them with a grain of salt. Treat the result as a prompt for reflection, not a verdict on your personality.',
    levels:{low:'rather low', mid:'medium', high:'rather high'},
    higher:'Higher score:', lower:'Lower score:', facets:'Facets',
    print:'Print / save as PDF', copyLink:'Copy link', copied:'Link to results copied', copyPrompt:'Copy the link:',
    csv:'Download CSV', takeIt:'Take the questionnaire',
    confirmRestart:'Start over? Your current answers will be deleted.',
    notSent:'Results are never sent anywhere.',
    locale:'en-GB', csvSep:',', decimalComma:false,
    csvHead:['name','date','questionnaire','language'], itemPrefix:'q',
    onlyCs:'The statements are currently available in Czech only.',
    interstitial:'interstitial facet, not included in the dimension scores'
  }
};

/* =====================================================================
   JAZYK / LANGUAGE   (?lang=en v adrese > uložená volba > čeština)
   ===================================================================== */
const LANGS = ['cs', 'en'];
let lang = (() => {
  const p = new URLSearchParams(location.search).get('lang');
  if (LANGS.includes(p)) return p;
  try { const s = localStorage.getItem('dotaznik:lang'); if (LANGS.includes(s)) return s; } catch(e){}
  return 'cs';
})();
const T = () => UI[lang];
const L = v => (v && typeof v === 'object' && !Array.isArray(v) && ('cs' in v || 'en' in v)) ? (v[lang] ?? v.cs) : v;
const nm = o => lang === 'en' ? o.en : o.name;      // název dimenze / facety
const sub = o => lang === 'cs' ? o.en : '';           // anglický podtitul v české verzi
const itemCount = t => t.items.cs.length;

function applyLang(){
  document.documentElement.lang = lang;
  document.title = T().appTitle;
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
}
function setLang(l){
  if (!LANGS.includes(l) || l === lang) return;
  const nameInput = document.getElementById('name');
  if (nameInput) draftName = nameInput.value;
  lang = l;
  try { localStorage.setItem('dotaznik:lang', l); } catch(e){}
  const params = new URLSearchParams(location.search);
  params.set('lang', l);
  history.replaceState(null, '', location.pathname + '?' + params.toString() + location.hash);
  applyLang();
  rerender();
}
document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang);
});

/* =====================================================================
   SKÓROVÁNÍ / SCORING
   ===================================================================== */
function parseKey(s){
  return s.trim().split(/\s+/).map(t => ({ n: parseInt(t, 10), r: /R$/i.test(t) }));
}
function itemScore(test, key, answers){
  const a = answers[key.n - 1];
  if (a == null) return null;
  return key.r ? (test.scale.length + 1 - a) : a;
}
function mean(xs){
  const v = xs.filter(x => x != null);
  return v.length ? v.reduce((a,b) => a + b, 0) / v.length : null;
}
function computeScores(test, answers){
  return test.factors.map(f => {
    const facets = f.facets.map(fc => {
      const keys = parseKey(fc.items);
      return { ...fc, keys, score: mean(keys.map(k => itemScore(test, k, answers))) };
    });
    // skóre dimenze = průměr přes všechny její položky (dle manuálu)
    const all = f.items ? parseKey(f.items) : facets.flatMap(fc => fc.keys);
    return { ...f, facets, score: mean(all.map(k => itemScore(test, k, answers))) };
  });
}
function levelOf(score){
  if (score < 2.5) return 'low';
  if (score > 3.5) return 'high';
  return 'mid';
}

/* =====================================================================
   POMOCNÉ FUNKCE / HELPERS
   ===================================================================== */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = x => x == null ? '' : (T().decimalComma ? x.toFixed(2).replace('.', ',') : x.toFixed(2));
const pct = (score, k) => ((score - 1) / (k - 1)) * 100;

const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const storeKey = id => 'dotaznik:' + id;

function render(html, keepScroll){ app.innerHTML = html; if (!keepScroll) window.scrollTo(0, 0); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function clearHash(){ history.replaceState(null, '', location.pathname + location.search); }
function resultsUrl(test, answers){
  return location.origin + location.pathname + location.search + '#v=' + test.id + '-' + answers.join('');
}

let state = null;      // { testId, answers, index, name }
let view = 'home';
let advanceTimer = null;
let draftName = '';
let rerender = () => renderHome();

function save(){ if (state) store.set(storeKey(state.testId), state); }

/* =====================================================================
   OBRAZOVKY / SCREENS
   ===================================================================== */
function renderHome(){
  view = 'home'; state = null; clearHash();
  rerender = () => renderHome();
  const u = T();
  const cards = TEST_ORDER.map(id => TESTS[id]).map(t => {
    const n = itemCount(t);
    const saved = store.get(storeKey(t.id));
    const done = saved ? saved.answers.filter(a => a != null).length : 0;
    let actions = `<button class="btn primary" data-start="${t.id}">${u.start}</button>`;
    if (saved && done === n) {
      actions = `<button class="btn primary" data-results="${t.id}">${u.showMine}</button>
                 <button class="btn" data-restart="${t.id}">${u.retake}</button>`;
    } else if (done > 0) {
      actions = `<button class="btn primary" data-resume="${t.id}">${u.resume(done, n)}</button>
                 <button class="btn" data-restart="${t.id}">${u.startOver}</button>`;
    }
    return `<div class="card">
      <h2>${esc(t.title)}</h2>
      <p class="muted">${esc(L(t.subtitle))}</p>
      <p>${esc(L(t.about))}</p>
      <p class="small muted">${u.meta(n, esc(L(t.duration)))}</p>
      ${t.items[lang] ? '' : `<p class="note small">${u.onlyCs}</p>`}
      <div class="row" style="margin-top:14px">${actions}</div>
    </div>`;
  }).join('');
  render(`
    <h1>${u.appTitle}</h1>
    <p class="muted">${u.homeLead}</p>
    ${cards}
    <footer>${u.homeFooter}</footer>
  `);
}

function renderIntro(testId){
  view = 'intro';
  rerender = () => renderIntro(testId);
  const t = TESTS[testId], u = T();
  render(`
    <button class="btn link" data-home>${u.back}</button>
    <h1>${esc(t.title)}</h1>
    <div class="card">
      <h2>${u.instructions}</h2>
      ${t.items[lang] ? '' : `<p class="note">${u.onlyCs}</p>`}
      <ul class="clean">${L(t.instructions).map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      <label class="field">
        <span>${u.nameLabel} <span class="muted small">${u.optional}</span></span>
        <input type="text" id="name" maxlength="60" autocomplete="off" placeholder="${esc(u.namePh)}" value="${esc(draftName)}">
      </label>
      <p class="note">${u.saveNote}</p>
      <div class="row" style="margin-top:16px">
        <button class="btn primary" data-begin="${t.id}">${u.begin}</button>
      </div>
    </div>
  `);
  document.getElementById('name').focus();
}

function renderQuestion(){
  view = 'question';
  rerender = () => renderQuestion();
  const t = TESTS[state.testId], u = T();
  const items = L(t.items);
  const i = state.index, n = items.length;
  const answered = state.answers.filter(a => a != null).length;
  const cur = state.answers[i];
  const isLast = i === n - 1;
  const firstMissing = state.answers.findIndex(a => a == null);

  let nextBtn;
  if (!isLast) {
    nextBtn = `<button class="btn" data-next ${cur == null ? 'disabled' : ''}>${u.next}</button>`;
  } else if (firstMissing === -1) {
    nextBtn = `<button class="btn primary" data-finish>${u.finish}</button>`;
  } else {
    nextBtn = `<button class="btn" data-goto="${firstMissing}">${u.missing(n - answered)}</button>`;
  }

  render(`
    <div class="qtop">
      <button class="btn link" data-home>${u.pause}</button>
      <span>${u.counter(i + 1, n)}</span>
    </div>
    <div class="progress" aria-hidden="true"><div style="width:${(answered / n) * 100}%"></div></div>
    <p class="qtext">${esc(items[i])}</p>
    <div class="options" role="group" aria-label="${u.agreement}">
      ${t.scale.map(o => `<button class="opt" data-answer="${o.v}" aria-pressed="${cur === o.v}">
          <span class="num">${o.v}</span><span>${esc(L(o.label))}</span></button>`).join('')}
    </div>
    <div class="qnav">
      <button class="btn" data-prev ${i === 0 ? 'disabled' : ''}>${u.prev}</button>
      ${nextBtn}
    </div>
    <p class="kbd-hint small muted">${u.kbd}</p>
  `);
}

function answer(v){
  const n = itemCount(TESTS[state.testId]);
  state.answers[state.index] = v;
  save();
  clearTimeout(advanceTimer);
  const atIndex = state.index;
  renderQuestion();
  if (atIndex < n - 1) {
    advanceTimer = setTimeout(() => {
      if (view === 'question' && state && state.index === atIndex) { state.index++; save(); renderQuestion(); }
    }, 220);
  }
}

function renderResults(testId, answers, opts = {}, keepScroll){
  view = 'results';
  rerender = () => renderResults(testId, answers, opts, true);
  const t = TESTS[testId], u = T();
  const k = t.scale.length;
  const scores = computeScores(t, answers);
  const name = opts.name || '';
  history.replaceState(null, '', location.pathname + location.search + '#v=' + t.id + '-' + answers.join(''));

  const factorCards = scores.map(f => {
    const lv = levelOf(f.score);
    const facets = f.facets.map(fc => `
      <div class="facet">
        <div>${esc(nm(fc))}${sub(fc) ? `<span class="sub">${esc(sub(fc))}</span>` : ''}</div>
        <div class="bar"><div class="fill" style="width:${pct(fc.score, k)}%"></div><div class="mid"></div></div>
        <div class="val">${fmt(fc.score)}</div>
      </div>`).join('');
    return `<div class="card">
      <div class="factor-head">
        <div><h2>${esc(nm(f))}</h2><div class="level">${sub(f) ? esc(sub(f)) + ' · ' : ''}${u.levels[lv]}${f.interstitial ? ' · ' + u.interstitial : ''}</div></div>
        <div class="score">${fmt(f.score)}</div>
      </div>
      <div class="bar"><div class="fill" style="width:${pct(f.score, k)}%"></div><div class="mid"></div></div>
      <div class="ticks"><span>1</span><span>3</span><span>5</span></div>
      <div class="poles">
        <div class="pole ${lv === 'high' ? 'on' : ''}"><b>${u.higher}</b> ${esc(L(f.high))}</div>
        <div class="pole ${lv === 'low' ? 'on' : ''}"><b>${u.lower}</b> ${esc(L(f.low))}</div>
      </div>
      ${f.facets.length ? `<details>
        <summary>${u.facets}</summary>
        ${facets}
      </details>` : ''}
    </div>`;
  }).join('');

  const header = opts.shared
    ? `<p class="muted">${u.shared}</p>`
    : `<p class="muted">${name ? esc(name) + ' · ' : ''}${new Date().toLocaleDateString(u.locale)}</p>`;

  render(`
    <button class="btn link no-print" data-home>${u.home}</button>
    <h1>${u.resultsTitle(esc(t.title))}</h1>
    ${header}
    <div class="card note" style="box-shadow:none">${u.resultsNote}</div>
    ${factorCards}
    <div class="results-actions no-print">
      <div class="row">
        <button class="btn primary" data-print>${u.print}</button>
        <button class="btn" data-copylink>${u.copyLink}</button>
        <button class="btn" data-csv>${u.csv}</button>
        ${opts.shared ? `<button class="btn" data-home>${u.takeIt}</button>` : `<button class="btn" data-restart="${t.id}">${u.retake}</button>`}
      </div>
    </div>
    <footer>${esc(L(t.credit))}<br>${u.notSent}</footer>
  `, keepScroll);

  app.querySelector('[data-print]').onclick = () => window.print();
  app.querySelector('[data-copylink]').onclick = () => copyText(resultsUrl(t, answers));
  app.querySelector('[data-csv]').onclick = () => downloadCSV(t, answers, scores, name);
}

/* =====================================================================
   EXPORT
   ===================================================================== */
function copyText(text){
  const u = T();
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast(u.copied), () => window.prompt(u.copyPrompt, text));
  } else {
    window.prompt(u.copyPrompt, text);
  }
}
function downloadCSV(t, answers, scores, name){
  const u = T();
  const head = [...u.csvHead];
  const row = [name, new Date().toISOString().slice(0, 10), t.id, lang];
  scores.forEach(f => {
    head.push(f.id + ' ' + nm(f)); row.push(fmt(f.score));
    f.facets.forEach(fc => { head.push(f.id + ': ' + nm(fc)); row.push(fmt(fc.score)); });
  });
  answers.forEach((a, i) => { head.push(u.itemPrefix + (i + 1)); row.push(a); });
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = '﻿' + head.map(q).join(u.csvSep) + '\r\n' + row.map(q).join(u.csvSep) + '\r\n';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  const safe = (name || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '');
  a.href = URL.createObjectURL(blob);
  a.download = `${t.id}-${safe || (lang === 'en' ? 'results' : 'vysledky')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* =====================================================================
   OVLÁDÁNÍ / CONTROLS
   ===================================================================== */
function startFresh(testId, name){
  state = { testId, answers: Array(itemCount(TESTS[testId])).fill(null), index: 0, name: name || '' };
  draftName = '';
  save();
  renderQuestion();
}

app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const d = b.dataset;
  if ('home' in d) { draftName = ''; return renderHome(); }
  if (d.start) return renderIntro(d.start);
  if (d.begin) return startFresh(d.begin, (document.getElementById('name') || {}).value || '');
  if (d.resume) {
    state = store.get(storeKey(d.resume));
    const miss = state.answers.findIndex(a => a == null);
    state.index = miss === -1 ? state.answers.length - 1 : miss;
    return renderQuestion();
  }
  if (d.restart) {
    if (!confirm(T().confirmRestart)) return;
    store.del(storeKey(d.restart));
    return renderIntro(d.restart);
  }
  if (d.results) {
    const s = store.get(storeKey(d.results));
    return renderResults(d.results, s.answers, { name: s.name });
  }
  if (d.answer) return answer(Number(d.answer));
  if ('prev' in d) { clearTimeout(advanceTimer); state.index = Math.max(0, state.index - 1); save(); return renderQuestion(); }
  if ('next' in d) { clearTimeout(advanceTimer); state.index++; save(); return renderQuestion(); }
  if (d.goto != null) { state.index = Number(d.goto); save(); return renderQuestion(); }
  if ('finish' in d) return renderResults(state.testId, state.answers, { name: state.name });
});

document.addEventListener('keydown', e => {
  if (view !== 'question' || e.altKey || e.ctrlKey || e.metaKey) return;
  const t = TESTS[state.testId];
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= t.scale.length) { e.preventDefault(); return answer(n); }
  if (e.key === 'ArrowLeft' && state.index > 0) { clearTimeout(advanceTimer); state.index--; save(); renderQuestion(); }
  if (e.key === 'ArrowRight' && state.index < itemCount(t) - 1 && state.answers[state.index] != null) {
    clearTimeout(advanceTimer); state.index++; save(); renderQuestion();
  }
});

window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => d.open = true));

/* Načtení: odkaz s výsledky (#v=hexaco60-1234...) nebo úvodní stránka */
function route(){
  const m = location.hash.match(/^#v=([a-z0-9]+)-(\d+)$/i);
  if (m && TESTS[m[1]]) {
    const t = TESTS[m[1]];
    const answers = m[2].split('').map(Number);
    if (answers.length === itemCount(t) && answers.every(a => a >= 1 && a <= t.scale.length)) {
      const own = store.get(storeKey(t.id));
      const isOwn = own && own.answers.join('') === m[2];
      return renderResults(t.id, answers, { shared: !isOwn, name: isOwn ? own.name : '' });
    }
  }
  renderHome();
}
window.addEventListener('hashchange', route);
applyLang();
route();
</script>
